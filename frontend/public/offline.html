<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Sahayak</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #faf9f5;
        color: #16160f;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.55;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12120f; color: #f2f0e9; }
        .card { border-color: #2f2f2b !important; }
        .label, p { color: #b3aea1 !important; }
      }
      .card { max-width: 32rem; border: 1px solid #e0dcd0; padding: 1.5rem; }
      .label {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #857f72;
        margin: 0;
      }
      h1 { font-size: 1.5rem; margin: 0.75rem 0 0; letter-spacing: -0.01em; }
      p { margin: 0.75rem 0 0; color: #575349; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label">Offline · ऑफ़लाइन</p>
      <h1>You are offline</h1>
      <p>Sahayak could not reach the network. Reconnect and try again — pages you have already opened stay available.</p>
      <p lang="hi">सहायक नेटवर्क से संपर्क नहीं कर सका। दोबारा जुड़ने पर पुनः प्रयास करें — पहले खोले गए पृष्ठ उपलब्ध रहेंगे।</p>
    </div>
  </body>
</html>
